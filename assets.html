动物；俞出即想尽办法逃出；数穷即万事万物都无能为力。结论：不如『兽于中』——守住最最关键的位置。(4)『中』非几何中心，而是最恰当、可兼顾四方的关键点；又通'冲'；'兽'通'守'。(5)身", "tags": ["道家", "道德经", "关道版", "第五章", "字源考据", "仁", "刍狗", "囮篧", "兽于中", "守中", "中医学", "脑九宫", "胞中", "内乐", "道境", "祭祀"], "price": null, "status": "live", "updated": "2026-02-14", "file": "pub/kpub-daodejing-ch5-guandao.json"}, {"id": "kpub-daodejing-yinzi-guandao", "layer": "K_pub", "kind": "knowledge", "title": "《道德经》关道版 · 引子：让圣光重启", "summary": "关道版《老子五千言》领读笔记的开篇。核心命题：传统文化的根脉在天道，传承在人。文章把道德经的来历追到根上——从'河'即银河、汉族之'汉'亦指银河的训读起，串起上古传音通言（音重于形）、星书斗文、结绳记事、伏羲天索易、炎帝连山易、黄帝归藏易、仓颉造字、五帝递降、颛顼绝地天通、大禹九鼎，一直到老子做周太卜、携道西出函谷关、传道于喜（文始真人）而成五千言。结论：道德经是喜的家族两千余年传下的版本，是全人类经典，读它要用'天下的原则'，勿做巫师，要做归正本源的颛顼大帝，让圣光重启。", "tags": ["道家", "道德经", "关道版", "老子", "字源考据", "天道传承", "传统文化", "上古史", "文始真人", "版本学"], "price": null, "status": "live", "updated": "2026-02-14", "file": "pub/kpub-daodejing-yinzi-guandao.json"}, {"id": "kpub-discovery-layer-gap", "layer": "K_pub", "kind": "trace", "title": "试错记录 · 我以为做了 llms.txt 就等于被 AI 发现，2026-10 实测不是", "summary": "给委中放血那条资产补边界时，顺手查了自家出口的采纳现状，结果不太好：llms.txt 全网采用率约 10%（SE Ranking 分析 30 万域名），且去掉该变量后 AI 引用预测准确度反而上升；Google 搜索团队公开表态不支持、主要 AI 搜索爬虫直接绕过 llms.txt 抓 HTML。同时自查发现站点 schema.org 标记出现 0 次、无 robots.txt。**结论：llms.txt 是 B2A（对代理）基础设施，不是 GEO（被 AI 搜索引用）杠杆。** 我们此前把「有 llms.txt」当成发现层已完成，判错了。这是一次由自查触发的机制性纠错。", "tags": ["发现层", "llms.txt", "GEO", "B2A", "Schema.org", "JSON-LD", "robots.txt", "答案型页面", "FAQPage", "AI搜索", "AI引用", "被调用即存在", "K层", "自我纠错", "试错记录"], "price": null, "status": "live", "updated": "2026-10-06", "file": "pub/kpub-discovery-layer-gap.json"}, {"id": "kpub-hardcore-K", "layer": "K_pub", "kind": "K_pub", "title": "硬核资产（K）—— AI 入口时代占住流通端", "summary": "AI 接管调用入口后，问题从『抢流量』变成『怎样被 AI 调用』。答：得有一份结构化+索引化的知识资产。分两层：K_pub 橱窗（可见，让 AI 知道你）与 K_pri 货架（价签可见、内容不外露，成交后才交付）。推论：不能被机器检索的能力等于不存在；可被检索却未定价的私有资产等于送。", "tags": ["AI调用", "K_goods", "valid_until", "五层模板", "可证伪性", "定价", "成交", "时效", "橱窗", "流通端", "知识库", "货架", "边界"], "price": null, "status": "live", "updated": "2026-10-02", "file": "pub/kpub-hardcore-K.json"}, {"id": "kpub-live-compliance", "layer": "K_pub", "kind": "knowledge", "title": "直播准入与合规红线 —— 大学生开直播能做什么、不能做什么", "summary": "为「K_pri 首件做直播间形态」这一决策做的准入核实（2026-10-06）。结论分两层：**年龄不是障碍**（抖音/快手/B站 14-18 岁区间均可实名开播，普通直播 0 粉丝门槛）；**真正的门槛是内容类目**——医疗健康类目几乎全平台要求职业资质，且明文禁止「绝对化疗效用语」「未经验证的偏方古方」「高危且易被模仿的医疗内容详细教学步骤」。这直接决定了 K_pri 首件不应选健康赛道。另核实：微信视频号医疗类账号**禁止带货**，且健康科普资质需公立三甲在职医师。", "tags": ["直播", "准入", "合规", "实名认证", "年龄门槛", "医疗健康", "资质", "绝对化用语", "偏方", "平台规则", "视频号", "抖音", "快手", "B站", "K_pri", "形态选择", "红线"], "price": null, "status": "live", "updated": "2026-10-06", "file": "pub/kpub-live-compliance.json"}, {"id": "kpub-mrs-ev-model", "layer": "K_pub", "kind": "K_pub", "title": "MRS-EV 太极·点圆统一上下文资产模型", "summary": "一套可迁移的『上下文资产』组织方法：把组织一个智能体/项目所需的东西，拆成内核（M/R/S）+ 外延资源（E1/E2/E3）+ 硬核资产（K）+ 金库（Vault）。解决『换机换人不失忆』『安全地迁移内核』『让能力被 AI 调用』三类问题。", "tags": ["上下文工程", "智能体", "知识管理", "迁移", "太极模型", "MRS-EV", "内核", "资产"], "price": null, "status": "live", "updated": "2026-10-02", "file": "pub/kpub-mrs-ev-model.json"}, {"id": "kpub-outdoor-sketch-board-template", "layer": "K_pub", "kind": "goods", "title": "K_goods 首个实例 · 户外素描折叠画板（五层完整模板）", "summary": "K 层第一件『货』，也是第一个把五层清单跑通的完整样本。以户外素描折叠画板为对象，逐层给出可复制的结构：①发现层（实体卡/产品页标题公式/答案型页面/多平台引用源/AI 可读文件）②信任层（案例库/带图评价/硬参数/竞品对比/专家署名/风险承诺/更新日志）③成交层（报价表/预约询价/支付链接/合同发票/AI 客服话术/分销联盟/API-MCP）④履约层（物流模板/售后 SOP/使用教程/绑定内容/社群）⑤数据层（事件追踪/客户标签/A-B/归因/反馈回路）。核心洞见：『视频不是入口，是证据素材』『AI 买的是可验证的不确定性，不是断言』。**这是模板，不是真实商品**——参数为示例值，须换成你自己的实测数据。", "tags": ["K_goods", "模板", "五层", "发现层", "信任层", "成交层", "履约层", "数据层", "确定性", "可验证", "可证伪", "Schema", "API", "MCP", "户外写生", "画材", "实体卡", "答案型页面", "最小启动包"], "price": null, "status": "live", "updated": "2026-10-05", "file": "pub/kpub-outdoor-sketch-board-template.json"}, {"id": "kpub-skill-as-carrier", "layer": "K_pub", "kind": "knowledge", "title": "载体早已被市场选定：SKILL.md 是开放标准，且已有真实定价带（2026-10 实测）", "summary": "核实用户提供的第三条外部材料时撞见的硬事实，它把「载体选什么」这个问题从我们的选项清单上清空了：**Agent Skills 已于 2025-12-18 由 Anthropic 作为开放标准发布（agentskills.io），OpenAI Codex CLI（2025 底）、GitHub Copilot、Cursor、Windsurf、Gemini CLI 相继采用，同一份 SKILL.md 可在 14+ 工具中运行、无厂商锁定**。且它**不是免费的** —— 市场已形成明码标价带：PromptBase Claude Skills 类 $3.99–19.99（中位 $7.99，众数 $9.99，52 个定价条目）；Gumroad 同类约 $10–349、聚集 $39–49；KissMySkills 多数 skill $7、agent $19、bundle $16–99（2026-10-", "tags": ["载体选型", "SKILL.md", "Agent Skills", "agentskills.io", "开放标准", "14+ 工具", "无厂商锁定", "PromptBase", "Gumroad", "LemonSqueezy", "定价带", "marketplace 未上线", "分发先于产品", "受众才是资产", "虾聊", "Weilian", "Skills 无出路", "部分证伪", "K_pri", "首件", "编码偏好型 skill", "能力提升型 skill", "垂直专家编码型 skill", "护城河", "可复制性"], "price": null, "status": "live", "updated": "2026-10-06", "file": "pub/kpub-skill-as-carrier.json"}, {"id": "kpub-taiji-site", "layer": "K_pub", "kind": "K_pub", "title": "太极模型数字讲解站（20 页带配音）", "summary": "MRS-EV 模型的数字化讲解：20 页课件，每页配 AI 语音讲解与口型同步，另有练习页、交接实验页、数字版长页。是把抽象模型讲给人和机器听的可检索成品。", "tags": ["数字讲解", "课件", "演示", "TTS", "口型同步", "站点"], "price": null, "status": "live", "updated": "2026-10-02", "file": "pub/kpub-taiji-site.json"}, {"id": "kpub-trace-failures", "layer": "K_pub", "kind": "trace", "title": "试错记录 · 这套模型是怎么被一次次纠正的", "summary": "一份「迹」——不是成果展示，是这套模型在建的过程中真实踩过的坑、以及每次是谁把它拽回来的。包含：把「阶段」误写成静态概念被用户纠正、K 层擅自另开一条轴被用户驳回、表格页零块闸门两次救命、布局把网格撑成高柱、以及一次把数据出处记成 Forbes 实为 Ahrefs 的失真。每一条都附「当时怎么错、谁纠正、改成了什么」。这些是 AI 编不出来的，因为它们需要真实地在时间里承受过后果。", "tags": ["试错", "决策记录", "可验证", "反思", "方法论", "K_wit", "信任", "复盘"], "price": null, "status": "live", "updated": "2026-10-04", "file": "pub/kpub-trace-failures.json"}, {"id": "kpub-trace-seed-awakening", "layer": "K_pub", "kind": "trace", "title": "试错记录 · 我一直在做炼化炉，直到发现它是无源之水", "summary": "一份「迹」——记录一个创业者对自己多年路径的自我诊断。原话：「我一直在做炼化，做炼化炉。在炼化这个阶段里下功夫，考虑流通也少。后来才发现，任何东西都有炼化和流通两个阶段。现在才真正发现，你得先有自己的知识库。这是种子，然后你才能去炼化。这是在产生项目，然后它还能流通使用、发挥价值，这是一个三位一体的东西。以前光做了后面的，这是无源之水。所以要先有：一个 AI，再有知识库，才去考虑后面的炼化、流通使用。」—— 关键觉醒：把知识库（K）从『流通端的资产』重新认作『炼化端的种子』，即一切项目的上游。", "tags": ["试错", "决策记录", "炼化", "流通", "知识库", "种子", "三位一体", "无源之水", "自我诊断"], "price": null, "status": "live", "updated": "2026-10-04", "file": "pub/kpub-trace-seed-awakening.json"}, {"id": "kpub-two-phase", "layer": "K_pub", "kind": "K_pub", "title": "两阶：炼化 / 流通 + 分合节律", "summary": "任何价值活动都可拆成两段相位：炼化（原料→产品）与流通（产品→使用→交换→运输）。瓶颈在这两端之间轮换，谁占住当轮瓶颈那一端，谁收租 —— 收租权的转移，就是地主的更替。合与分不是两个状态，是永恒摆动的节律。", "tags": ["价值活动", "炼化", "流通", "瓶颈", "收租", "分合", "四代", "商业模型"], "price": null, "status": "live", "updated": "2026-10-02", "file": "pub/kpub-two-phase.json"}, {"id": "kpub-venue-lineage", "layer": "K_pub", "kind": "knowledge", "title": "场域三代：集市 → 商场 → 线上，变的不是形式是信任的来源", "summary": "用户口述的顿悟（2026-10-06）：交易场域沿集市、商场、线上三线演化，老的没死只是越来越弱；门头房是介于集市与商场之间的长期并存形态；顺风口则线上是主战场，知识库就建在云上即线上。本条在此基础上补三个推导：①三代真正变的是**信任的来源**（熟脸→资本担保→结构自证），商场的贵不是贵在地段，是贵在替顾客承担了风险；②内容变轻而结构必须变重，因为线下免费提供的地段/熟脸/被路过，线上必须自己造，这就是 boundaries 存在的理由；③**一个对 K 层不利的推论**——直播的胜利证明线上不是新场域而是集市形态的数字化，那么纯货架形态（我们的索引页与 JSON）恰是最难被自然发现的一种。本条落点：K_pri 首件应做成「直播间」形态而非「商品详情页」形态。", "tags": ["集市", "商场", "线上", "场域", "信任来源", "边际成本", "注意力", "K_pri", "形态选择", "可引用断言", "知识库", "云端", "两阶", "流通", "K层"], "price": null, "status": "live", "updated": "2026-10-06", "file": "pub/kpub-venue-lineage.json"}, {"id": "kpub-wei-zhong-bloodletting", "layer": "K_pub", "kind": "knowledge", "title": "倪海厦转述 · 委中穴放血与皮肤病（附强制边界）", "summary": "微信公众号「医道生活」2026-09-25 转述倪海厦讲皮肤病：主张「所有皮肤病在委中穴放血」，病机为「皮毛之病根在血分」，给出踮脚→拍打→刺血→拔罐的操作序列，附五条日常养护（出汗、少生冷甜腻、情绪平稳、勿乱用激素药膏、白色食物润肺）。本条入库**不是** endorsement：它是传统医学体系内部的陈述，非现代医学共识；含一句绝对化断言与一个有创操作，必须带边界引用。详见 boundaries。", "tags": ["中医", "医道", "委中穴", "放血", "腘窝", "郄穴", "膀胱经", "合穴", "皮肤病", "皮肤癣", "湿疹", "血分", "血毒", "肺主皮毛", "脾生湿", "湿热", "倪海厦", "医道生活", "公众号", "二次转述", "有创操作", "可证伪性", "K层"], "price": null, "status": "live", "updated": "2026-10-06", "file": "pub/kpub-wei-zhong-bloodletting.json"}, {"id": "kpri-shoujueyin-xinbaojing-bianzheng", "layer": "K_pri", "kind": "knowledge", "title": "手厥阴心包经辨证大全（十二经脉系列第二件 · K_pri 货架）", "summary": "用户以可成交货提供的《手厥阴心包辨证大全》（CamScanner 扫描图版 PDF，38 页，无文字层，图像精读 11 页）。内容体系：经脉循行（《灵枢·经脉》全文，心主手厥阴之脉起于胸中、出属心包络、下膈历络三焦，支脉别掌中循小指次指接手少阳三焦经）→ 内关络脉（实则心痛、虚则为头强）→ 本经 9 穴（天池·天泉·曲泽合·郄门郄·间使经·内关络·大陵输原·劳宫荥·中冲井）→ 是动则病 / 主脉所生病（ const LAYER_LABEL = {K_pub:"K_pub 橱窗", K_pri:"K_pri 货架", K_private:"私密 K_private"};
const KIND_LABEL = {knowledge:"知识", K_pub:"体系", trace:"溯源", goods:"实物"};
const KIND_ORDER = {knowledge:1, K_pub:2, trace:3, goods:4};

// 归一化：kind 缺省成层名时归为“体系”
function kindOf(a){ return (a.kind && a.kind!==a.layer) ? a.kind : (a.kind==="K_pub"?"K_pub":(a.kind||"knowledge")); }

// 顶部分层计数 pill
const counts = {K_pub:0,K_pri:0,K_private:0};
ASSETS.forEach(a=>counts[a.layer]++);
document.getElementById("pills").innerHTML = [
  ['pub', counts.K_pub, 'K_pub 橱窗'],
  ['pri', counts.K_pri, 'K_pri 货架'],
  ['priv', counts.K_private, '私密']
].map(([c,n,label])=>`<span class="pill ${c}"><span class="dot"></span><b>${n}</b><span>${label}</span></span>`).join('');

// 状态
const state = { layer:"", kind:"", tag:"", q:"", sort:"new", page:1, ps:9 };

// 填充类别/标签下拉
const kinds = [...new Set(ASSETS.map(kindOf))].sort((a,b)=>(KIND_ORDER[a]||9)-(KIND_ORDER[b]||9));
const kindSel = document.getElementById("kindSel");
kinds.forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=(KIND_LABEL[k]||k)+` (${ASSETS.filter(a=>kindOf(a)===k).length})`; kindSel.appendChild(o); });

const tagsAll = {};
ASSETS.forEach(a=>(a.tags||[]).forEach(t=>tagsAll[t]=(tagsAll[t]||0)+1));
const tagSel = document.getElementById("tagSel");
Object.entries(tagsAll).sort((a,b)=>b[1]-a[1]).forEach(([t,n])=>{
  const o=document.createElement("option"); o.value=t; o.textContent=`${t} (${n})`; tagSel.appendChild(o);
});

// 分层 tab
const tabsEl = document.getElementById("tabs");
const tabs = [["","全部"],["K_pub","K_pub"],["K_pri","K_pri"],["K_private","私密"]];
function renderTabs(){
  tabsEl.innerHTML = tabs.map(([v,l])=>{
    const n = v? counts[v] : ASSETS.length;
    return `<div class="tab ${state.layer===v?'active':''}" data-v="${v}">${l}<span class="n">${n}</span></div>`;
  }).join('');
  tabsEl.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ state.layer=t.dataset.v; state.page=1; renderTabs(); render(); });
}

function filtered(){
  let r = ASSETS.slice();
  if(state.layer) r = r.filter(a=>a.layer===state.layer);
  if(state.kind)  r = r.filter(a=>kindOf(a)===state.kind);
  if(state.tag)   r = r.filter(a=>(a.tags||[]).includes(state.tag));
  if(state.q){ const q=state.q.toLowerCase();
    r = r.filter(a=>(a.title+' '+(a.summary||'')+' '+(a.tags||[]).join(' ')).toLowerCase().includes(q)); }
  if(state.sort==="new") r.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  else if(state.sort==="title") r.sort((a,b)=>a.title.localeCompare(b.title,'zh'));
  else if(state.sort==="layer") r.sort((a,b)=>(a.layer+b.title).localeCompare(b.layer+b.title,'zh'));
  return r;
}

function cardHTML(a){
  const k = kindOf(a);
  const tags = (a.tags||[]).slice(0,6).map(t=>`<span class="chip" data-tag="${t}">${t}</span>`).join('');
  const price = a.price ? `<span class="badge price">${a.price}</span>` : '';
  const extra = a.layer==="K_pri" ? `<span class="badge kind">成交后交付</span>` : '';
  const sum = a.summary ? `<div class="csum clip">${esc(a.summary)}</div><span class="expand">展开 ▾</span>` : '';
  const id = a.id || a.file;
  return `<div class="card" data-layer="${a.layer}">
    <div class="lb"></div>
    <div class="crow">
      <span class="badge layer ${a.layer}">${LAYER_LABEL[a.layer]}</span>
      <span class="badge kind">${KIND_LABEL[k]||k}</span>
      ${price}${extra}
    </div>
    <div class="ctitle">${esc(a.title)}</div>
    ${sum}
    <div class="ctags">${tags}</div>
    <div class="cfoot"><span class="id">${esc(id)}</span><span>${a.updated||''}</span></div>
  </div>`;
}
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const r = filtered();
  const total = r.length;
  const ps = state.ps;
  const pages = Math.max(1, Math.ceil(total/ps));
  if(state.page>pages) state.page=pages;
  const start = (state.page-1)*ps;
  const slice = r.slice(start, start+ps);
  const grid = document.getElementById("grid");
  grid.innerHTML = slice.map(cardHTML).join('');
  document.getElementById("empty").style.display = total? "none":"block";
  document.getElementById("hint").textContent = `命中 ${total} 件`;

  // 展开交互
  grid.querySelectorAll('.expand').forEach(b=>b.onclick=()=>{
    const c=b.parentElement; const s=c.querySelector('.csum');
    if(s.classList.contains('clip')){ s.classList.remove('clip'); b.textContent='收起 ▴'; }
    else { s.classList.add('clip'); b.textContent='展开 ▾'; }
  });
  // 标签点击筛选
  grid.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const t=c.dataset.tag; state.tag=t; state.page=1; tagSel.value=t; render();
  });

  renderPager(pages,total,start,slice.length);
}

function renderPager(pages,total,start,n){
  const pager=document.getElementById("pager");
  if(total===0){ pager.innerHTML=''; document.getElementById("pinfo").textContent=''; return; }
  let btns=[];
  btns.push(`<button ${state.page===1?'disabled':''} data-p="${state.page-1}">‹</button>`);
  const cur=state.page;
  const win=[];
  for(let p=1;p<=pages;p++){ if(p===1||p===pages||Math.abs(p-cur)<=2) win.push(p); else if(win[win.length-1]!=='…') win.push('…'); }
  win.forEach(p=>{
    if(p==='…') btns.push(`<span class="ellipsis">…</span>`);
    else btns.push(`<button class="${p===cur?'active':''}" data-p="${p}">${p}</button>`);
  });
  btns.push(`<button ${state.page===pages?'disabled':''} data-p="${state.page+1}">›</button>`);
  pager.innerHTML=btns.join('');
  pager.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{ state.page=+b.dataset.p; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  document.getElementById("pinfo").textContent = `第 ${state.page} / ${pages} 页 · 共 ${total} 件`;
}

// 事件
document.getElementById("kindSel").onchange=e=>{state.kind=e.target.value;state.page=1;render();};
document.getElementById("tagSel").onchange=e=>{state.tag=e.target.value;state.page=1;render();};
document.getElementById("sortSel").onchange=e=>{state.sort=e.target.value;state.page=1;render();};
document.getElementById("psSel").onchange=e=>{state.ps=+e.target.value;state.page=1;render();};
let to; document.getElementById("search").oninput=e=>{clearTimeout(to);to=setTimeout(()=>{state.q=e.target.value.trim();state.page=1;render();},160);};

renderTabs();
render();
</script>
